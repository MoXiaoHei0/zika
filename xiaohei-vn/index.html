<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>窗口对话 · 自介卡（基础版）</title>
<style>
  :root{
    --bg:#0a0a0e;
    --ink:#f3efe8;
    --dim:#a9a49c;
    --faint:rgba(243,239,232,.38);
    --line:rgba(243,239,232,.12);
    --accent:#c2312f;
    --accent-bright:#e23b38;
    --accent-soft:rgba(194,49,47,.15);
    --glass:rgba(18,17,21,.86);
    --serif:"Songti SC","Times New Roman","Noto Serif CJK SC","Source Han Serif SC",serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(194,49,47,.16), transparent 60%),
      radial-gradient(900px 420px at 12% 110%, rgba(194,49,47,.08), transparent 55%),
      var(--bg);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:repeating-linear-gradient(0deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
  }

  /* ===== 开场 ===== */
  .veil{
    position:fixed;inset:0;z-index:60;background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    opacity:1;transition:opacity 1.1s ease, visibility 1.1s ease;visibility:visible;
    cursor:pointer;
  }
  .veil.off{opacity:0;visibility:hidden;pointer-events:none;}
  .veil .v-line{font-size:11px;letter-spacing:.55em;color:var(--faint);text-align:center;}
  .veil .v-title{font-family:var(--serif);font-size:clamp(24px,4.6vw,38px);letter-spacing:.34em;color:var(--ink);text-align:center;}
  .veil .v-title em{font-style:normal;color:var(--accent-bright);}
  .veil .v-tap{font-size:10px;letter-spacing:.4em;color:var(--dim);animation:blink 2.2s infinite;}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  /* ===== 对话场景 ===== */
  .app{max-width:980px;margin:0 auto;padding:18px 16px 24px;min-height:100vh;display:flex;flex-direction:column;}
  .top{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--glass);margin-bottom:14px;
  }
  .top .name{font-family:var(--serif);font-size:17px;letter-spacing:.3em;}
  .top .name small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:.4em;color:var(--faint);font-weight:400;}
  .top .state{font-size:10px;letter-spacing:.25em;color:var(--accent-bright);}
  .top .meter{width:96px;height:4px;border-radius:99px;background:rgba(243,239,232,.12);overflow:hidden;}
  .top .meter i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--accent),var(--accent-bright));border-radius:99px;transition:width .8s ease;}

  .stage{
    flex:1;min-height:320px;position:relative;display:flex;align-items:flex-end;justify-content:center;
    border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:
      linear-gradient(180deg, rgba(194,49,47,.05), transparent 34%),
      radial-gradient(560px 300px at 50% 78%, rgba(194,49,47,.10), transparent 62%),
      rgba(13,12,16,.72);
  }
  /* 半身立绘占位 */
  .figure{
    position:relative;width:min(300px,72%);height:min(460px,88%);
    display:flex;align-items:center;justify-content:center;
  }
  .figure .sil{
    width:100%;height:100%;
    background:
      radial-gradient(closest-side at 50% 34%, rgba(226,59,56,.34), transparent 70%),
      linear-gradient(172deg, rgba(243,239,232,.10), rgba(243,239,232,.02));
    border:1px dashed rgba(226,59,56,.45);border-radius:12px;
    position:relative;
  }
  .figure .sil::before{ /* 头部剪影 */
    content:"";position:absolute;left:50%;top:13%;transform:translateX(-50%);
    width:26%;aspect-ratio:1/1.15;border-radius:46% 46% 40% 40%;
    border:1px solid rgba(243,239,232,.30);
    background:linear-gradient(160deg, rgba(243,239,232,.12), rgba(243,239,232,.03));
  }
  .figure .sil::after{ /* 身体剪影 */
    content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);
    width:62%;height:58%;border-radius:46% 46% 0 0;
    border:1px solid rgba(243,239,232,.24);
    background:linear-gradient(160deg, rgba(243,239,232,.09), rgba(243,239,232,.02));
  }
  .figure .ph-text{
    position:absolute;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);
    font-size:10px;letter-spacing:.5em;color:var(--faint);white-space:nowrap;
  }
  .figure .name-tag{
    position:absolute;z-index:2;top:10px;left:50%;transform:translateX(-50%);
    font-family:var(--serif);font-size:13px;letter-spacing:.5em;color:var(--accent-bright);
    border:1px solid rgba(226,59,56,.5);padding:5px 16px;border-radius:999px;
    background:rgba(10,10,14,.72);
  }

  /* 对话记录 */
  .log{
    max-height:210px;overflow-y:auto;padding:14px 16px 6px;display:none;flex-direction:column;gap:10px;
  }
  .log.show{display:flex;}
  .log .row{display:flex;gap:8px;}
  .log .row.me{justify-content:flex-end;}
  .log .row .bub{
    max-width:76%;padding:8px 13px;border-radius:12px;font-size:12.5px;line-height:1.8;letter-spacing:.04em;
    background:rgba(243,239,232,.06);border:1px solid var(--line);color:var(--dim);
  }
  .log .row.me .bub{background:rgba(194,49,47,.16);border-color:rgba(226,59,56,.4);color:var(--ink);}
  .log .row.role .bub{border-left:2px solid rgba(226,59,56,.7);}

  /* 对话框 */
  .dbox{
    margin-top:12px;padding:16px 18px 14px;border-radius:12px;
    background:var(--glass);border:1px solid rgba(226,59,56,.32);
    box-shadow:0 16px 44px rgba(0,0,0,.5);
    min-height:92px;position:relative;
  }
  .dbox .who{font-size:10px;letter-spacing:.4em;color:var(--accent-bright);margin-bottom:6px;}
  .dbox .txt{font-family:var(--serif);font-size:14.5px;line-height:1.95;letter-spacing:.06em;color:var(--ink);min-height:52px;}
  .dbox .txt .caret{display:inline-block;width:7px;height:15px;background:var(--accent-bright);vertical-align:-2px;margin-left:2px;animation:blink .9s infinite;}

  /* 选项 */
  .choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
  .choices .ch{
    border:1px solid rgba(226,59,56,.5);background:rgba(226,59,56,.08);color:#ecc4c0;
    font-size:12px;letter-spacing:.14em;padding:8px 15px;border-radius:999px;cursor:pointer;
    transition:.28s;
  }
  .choices .ch:hover{background:rgba(226,59,56,.85);color:#fff;}

  /* 输入 */
  .inrow{display:flex;gap:8px;margin-top:12px;}
  .inrow input{
    flex:1;background:rgba(243,239,232,.05);border:1px solid var(--line);border-radius:99px;
    color:var(--ink);font-size:13px;letter-spacing:.05em;padding:11px 18px;outline:none;
  }
  .inrow input:focus{border-color:rgba(226,59,56,.55);}
  .inrow button{
    border:1px solid rgba(226,59,56,.6);background:var(--accent);color:#fff;
    font-size:12px;letter-spacing:.2em;padding:0 22px;border-radius:99px;cursor:pointer;transition:.28s;
  }
  .inrow button:hover{background:var(--accent-bright);}
  .inrow button:disabled{opacity:.4;cursor:not-allowed;}

  footer.tpl-foot{text-align:center;font-size:9px;letter-spacing:.4em;color:var(--faint);margin-top:18px;}
</style>
</head>
<body>

<!-- 开场 -->
<div class="veil" id="veil">
  <div class="v-line">SCENE · 窗口对话</div>
  <div class="v-title">触 <em>碰</em> 她</div>
  <div class="v-tap">— 轻触开始 —</div>
</div>

<main class="app">
  <header class="top">
    <div class="name">小黑<small>DANGER · 收容物档案</small></div>
    <div class="state" id="mood">心情 · 平静</div>
    <div class="meter"><i id="meterFill"></i></div>
  </header>

  <div class="stage">
    <div class="figure" id="figureBox">
      <div class="sil" id="sil"></div>
      <div class="name-tag" id="figName">小黑</div>
      <div class="ph-text">立绘待绘制 · 占位</div>
    </div>
  </div>

  <div class="log" id="logBox"></div>

  <div class="dbox">
    <div class="who" id="who">小黑</div>
    <div class="txt" id="talk"></div>
  </div>

  <div class="choices" id="choicesBox"></div>

  <div class="inrow">
    <input id="freeInput" type="text" placeholder="问她点什么……" maxlength="40" autocomplete="off" />
    <button id="sendBtn" type="button">提问</button>
  </div>

  <footer class="tpl-foot">— 窗口对话 · 基础版 —</footer>
</main>

<script>
(function(){
  "use strict";

  /* ================= 配置区（角色图与内容就绪后只改这里） ================= */
  var CONFIG = {
    charName: "小黑",
    alias: "黑酱",
    tagline: "人们都尝试用心理学去剖析了解自己，最后发现了自己的苦难和虚无",
    avatarUrl: "",          // ← 立绘图 URL，画好后填入
    avatarAlt: "立绘待绘制 · 占位",
    intro: "一个很好说话的光遇底层病陪。有什么需要可以积极与我沟通。",
    styleMain: "上位 · 高压 · 高恋 · 贬低 · 精控",
    styleSub: "意识流 · 钓系 · 高恋 · 调情 · PUA",
    notice: "请提前告知您的称呼、喜好和雷点。下单默认已读须知，踩暗雷概不负责。约会中婉拒硬怼、搞笑、出戏、挂机、故意不配合等行为。不适请在 30/5min、60/10min 内退单。本人保留退单及永拒权利。",
    orderTime: "周中 / 周末（待补充）",
    links: { "板评": "https://www.kdocs.cn/l/cd52uTHnVsoy", "话术": "https://www.kdocs.cn/l/cnW5naLAmVGD" }
  };

  /* 知识库：关键词 → 反应（不同问题不同语气/态度） */
  var KNOWLEDGE = [
    { keys:["你是谁","名字","介绍","圈名","叫什么"], mood:"淡", moodText:"心情 · 淡", reply: function(c){
        return "圈名" + c.charName + "，也可以叫我" + c.alias + "。\n" + c.tagline;
      }},
    { keys:["风格","玩法","主调","副调"], mood:"戏谑", moodText:"心情 · 玩味", reply: function(c){
        return "主调是" + c.styleMain + "；副调嘛……" + c.styleSub + "。想试试哪种？";
      }},
    { keys:["须知","规矩","注意","雷点","避雷"], mood:"正", moodText:"心情 · 严肃", reply: function(c){
        return "规矩不多，但踩雷概不负责：\n" + c.notice;
      }},
    { keys:["时间","接单","什么时候","几点"], mood:"淡", moodText:"心情 · 平静", reply: function(c){
        return "接单时间：" + c.orderTime + "。具体排期可以聊。";
      }},
    { keys:["板评","评价","repo"], mood:"淡", moodText:"心情 · 平静", reply: function(c){
        return "板评在这：" + c.links["板评"];
      }},
    { keys:["话术","语录"], mood:"戏谑", moodText:"心情 · 玩味", reply: function(c){
        return "话术集： " + c.links["话术"] + "，拿去参考。";
      }},
    { keys:["多少钱","价格","付费","约"], mood:"戏谑", moodText:"心情 · 玩味", reply: function(c){
        return "钱的事私聊谈，先说说你想要什么。";
      }},
    { keys:["你","在吗","hi","嗨","你好","hello"], mood:"暖", moodText:"心情 · 微光", reply: function(c){
        return "在。想聊点什么，还是想约一局？";
      }}
  ];

  /* 兜底：无关/未知输入 → 多种反应轮换（贴合角色性格） */
  var FALLBACKS = [
    "听不懂。换句人话再说。",
    "你这句话不在我的档案里……挑点别的问。",
    "嗯……这个问题我们不谈这个。",
    "有点意思，但我先不回答。换一个。",
    "别试探了，问点实在的。"
  ];

  /* ================= 引擎 ================= */
  var veil = document.getElementById("veil");
  var talk = document.getElementById("talk");
  var who = document.getElementById("who");
  var mood = document.getElementById("mood");
  var meterFill = document.getElementById("meterFill");
  var logBox = document.getElementById("logBox");
  var choicesBox = document.getElementById("choicesBox");
  var freeInput = document.getElementById("freeInput");
  var sendBtn = document.getElementById("sendBtn");
  var figureBox = document.getElementById("figureBox");
  var sil = document.getElementById("sil");
  var figName = document.getElementById("figName");

  var interest = 30;             // 兴趣值（文游状态条）
  var typing = false;
  var fallIdx = 0;

  /* 立绘替换：有图则显示图，无图保留剪影占位 */
  function renderFigure(){
    if (CONFIG.avatarUrl){
      sil.style.backgroundImage = "url(" + CONFIG.avatarUrl + ")";
      sil.style.backgroundSize = "cover";
      sil.style.backgroundPosition = "center top";
      sil.style.border = "none";
      sil.style.borderRadius = "12px";
      var ph = sil.parentNode.querySelector(".ph-text");
      if (ph) ph.style.display = "none";
    }
    figName.textContent = CONFIG.charName;
  }
  renderFigure();

  /* 打字机 */
  function typeWrite(text, cb){
    typing = true;
    talk.textContent = "";
    var i = 0;
    (function tick(){
      if (i < text.length){
        talk.textContent = text.slice(0, i + 1);
        i++;
        setTimeout(tick, 38);
      } else {
        typing = false;
        if (cb) cb();
      }
    })();
  }

  /* 追加历史气泡 */
  function pushLog(role, text){
    logBox.classList.add("show");
    var row = document.createElement("div");
    row.className = "row " + role;
    var bub = document.createElement("div");
    bub.className = "bub";
    bub.textContent = text;
    row.appendChild(bub);
    logBox.appendChild(row);
    logBox.scrollTop = logBox.scrollHeight;
  }

  /* 设置心情与兴趣 */
  function setMood(t, delta){
    mood.textContent = t;
    interest = Math.max(8, Math.min(96, interest + (delta || 0)));
    meterFill.style.width = interest + "%";
  }

  /* 角色回应 */
  function say(text, moodText, delta){
    who.textContent = CONFIG.charName;
    if (moodText) setMood(moodText, delta);
    pushLog("role", text.replace(/\n/g, " "));
    typeWrite(text);
  }

  /* 知识匹配 */
  function lookup(q){
    for (var i = 0; i < KNOWLEDGE.length; i++){
      var k = KNOWLEDGE[i].keys;
      for (var j = 0; j < k.length; j++){
        if (q.indexOf(k[j]) !== -1) return KNOWLEDGE[i];
      }
    }
    return null;
  }

  /* 自由提问 */
  function ask(q){
    if (!q || typing) return;
    pushLog("me", q);
    var hit = lookup(q);
    if (hit){
      hit.reply(CONFIG);
      say(hit.reply(CONFIG), hit.moodText, 10);
    } else {
      var fb = FALLBACKS[fallIdx % FALLBACKS.length];
      fallIdx++;
      say(fb, "心情 · 不动", -6);
    }
    freeInput.value = "";
  }

  /* 快捷选项 */
  var QUICK = [
    "你是谁？", "什么风格？", "有什么规矩？", "接单时间？", "板评 / 话术？", "多少钱？"
  ];
  function renderChoices(){
    choicesBox.innerHTML = "";
    QUICK.forEach(function(t){
      var b = document.createElement("button");
      b.className = "ch";
      b.textContent = t;
      b.addEventListener("click", function(){ ask(t.replace(/[？?]/g, "")); });
      choicesBox.appendChild(b);
    });
  }
  renderChoices();

  /* 开场 */
  function boot(){
    veil.classList.add("off");
    say("……你来了。\n想问什么，直接说。", "心情 · 平静", 0);
  }
  veil.addEventListener("click", boot);
  document.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !typing){
      ask(freeInput.value.trim());
    }
  });
  sendBtn.addEventListener("click", function(){ ask(freeInput.value.trim()); });

})();
</script>
</body>
</html>
